name: Test and build

# Builds are published as files of a GitHub (pre-)release instead of
# workflow artifacts (release files do not count against the artifact quota):
#   pull request / manual run  -> release "preview-0.6a" (replaced every run)
#   tag v*                     -> release with the tag name

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PREVIEW_TAG: preview-0.6a

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Build the ACME assembler (reference for the tests)
        run: |
          git clone --depth 1 https://github.com/meonwax/acme.git /tmp/acme
          make -C /tmp/acme/src
          sudo cp /tmp/acme/src/acme /usr/local/bin/
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee test.log
      - name: Screenshots of the GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python tools/screenshots.py screenshots 2>&1 | tee -a test.log
      - name: Publish screenshots (branch ci-screenshots)
        run: |
          cd screenshots
          git init -q
          git checkout -q -b ci-screenshots
          git add *.png
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "GUI screenshots ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" ci-screenshots
      - name: Show log in the annotations
        if: failure()
        run: python .github/log_annotation.py test.log

  prepare:
    needs: test
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        name: Create the release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
                --title "WAV2C64 $TAG" --notes "WAV2C64 $TAG for Windows, macOS and Linux."
          else
            TAG="$PREVIEW_TAG"
            SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
              --title "WAV2C64 0.6a preview build" \
              --notes "Automatic test build of commit $SHA (not a final release)."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libpulse0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 file
      - run: pip install -r requirements-build.txt
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          python packaging/build.py 2>&1 | tee build.log
      - name: Upload to the release
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Show log in the annotations
        if: failure()
        shell: bash
        run: python .github/log_annotation.py build.log
